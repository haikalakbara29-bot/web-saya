<!DOCTYPE html>
<html>
<head>
    <title>Mini Project Web</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Mini Web App 🚀</h1>

    <!-- INPUT NAMA -->
    <div class="section">
        <h2>Masukkan Nama</h2>
        <input type="text" id="namaInput" placeholder="Ketik nama...">
        <button onclick="tampilkanNama()">Tampilkan</button>
        <p id="hasilNama"></p>
    </div>

    <!-- DAFTAR HOBI -->
    <div class="section">
        <h2>Daftar Hobi</h2>
        <input type="text" id="hobiInput" placeholder="Masukkan hobi">
        <button onclick="tambahHobi()">Tambah</button>
        <button onclick="hapusSemua()">Hapus Semua</button>

        <ul id="listHobi"></ul>
    </div>

    <!-- FETCH API -->
    <div class="section">
        <h2>Data User</h2>

        <p id="loading">Loading...</p>
        <p id="error"></p>

        <ul id="dataUser"></ul>
    </div>

<script src="script.js"></script>

</body>
</html>
